[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yuhang-space-backend"
version = "0.1.0"
description = "寰宇智杭智能生活管理平台 - 后端"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",

    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # 认证与安全
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",

    # 大模型
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",

    # 工具库
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
